name: Lean 4 formal verification

on:
  push:
    branches: [main]
    paths:
      - '*.lean'
      - 'lakefile.toml'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - '.github/workflows/lean.yml'
  pull_request:
    paths:
      - '*.lean'
      - 'lakefile.toml'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - '.github/workflows/lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formal:
    name: Build and kernel-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          test: false
          lint: false
      - name: Build every Lean library with the pinned toolchain
        run: lake build
      - name: Compile every top-level Lean module independently
        run: |
          for module in GreekFoundations GreekHarmonics GreekCosmos MusicOfTheSpheres; do
            lake env lean "${module}.lean"
          done
      - name: Reject unproved placeholders and explicit axioms
        run: |
          if grep -nE '(^|[[:space:]])(sorry|admit|axiom)[[:space:]]' -- *.lean; then
            echo "::error::Unproved placeholder or explicit axiom found in a root Lean source"; exit 1
          fi
