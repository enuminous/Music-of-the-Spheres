name: Validate bilingual desktop

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'verify_site.mjs'
      - 'README.md'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'verify_site.mjs'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Check standalone UI script and references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse JavaScript and inspect UI contract
        run: node verify_site.mjs
